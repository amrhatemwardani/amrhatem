<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#16233f"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .name { font: 700 54px -apple-system, 'Segoe UI', Inter, sans-serif; fill: #f4f6fb; letter-spacing: -1px; }
    .sub  { font: 400 18px 'SFMono-Regular', Consolas, monospace; fill: #8fa3c7; }
    .cur  { fill: #4cc9f0; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <rect width="900" height="200" rx="14" fill="url(#grid)"/>
  <text class="name" x="48" y="95">Amr Wardani</text>
  <text class="sub" x="50" y="135">data engineering / power bi / signals</text>
  <rect class="cur" x="472" y="119" width="10" height="20"/>
</svg>
